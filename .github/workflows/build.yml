name: Build PhasmoCheatV

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore "PhasmoCheatV Recode.sln"

      - name: Restore legacy ImGui backend paths
        shell: pwsh
        run: |
          Copy-Item libs/imgui/backends/imgui_impl_dx11.* libs/imgui/ -Force
          Copy-Item libs/imgui/backends/imgui_impl_win32.* libs/imgui/ -Force
          Copy-Item libs/stb/stb_image.h libs/imgui/ -Force

      - name: Disable unavailable optional cosmetics SDK
        shell: pwsh
        run: |
          $p = 'Globals.h'
          $content = Get-Content $p -Raw
          if ($content -notmatch '#define COSMETICSUNLOCKER 1') {
            Write-Host 'Cosmetics SDK is already disabled or the project layout changed.'
          } else {
            $content.Replace('#define COSMETICSUNLOCKER 1', '#define COSMETICSUNLOCKER 0') | Set-Content $p
            Write-Host 'Cosmetics SDK unavailable in the public repository; building without it.'
          }

      - name: Generate missing miniz export header
        shell: pwsh
        run: |
          @'
          #pragma once
          #define MINIZ_EXPORT
          '@ | Set-Content libs/miniz/miniz_export.h

      - name: Fix CI resource path
        shell: pwsh
        run: |
          $p = 'PhasmoCheatV Injector/PhasmoCheatV Injector.rc'
          (Get-Content $p -Raw).Replace('D:\projects\PhasmoCheatV Recode', (Get-Location).Path) | Set-Content $p

      - name: Build Release x64
        run: >-
          msbuild "PhasmoCheatV Recode.sln"
          /m
          /t:Build
          /p:Configuration=Release
          /p:Platform=x64
          /p:PlatformToolset=v143
          /p:OutDir="${{ github.workspace }}\build\"

      - name: Verify build outputs
        shell: pwsh
        run: |
          $outputs = Get-ChildItem build -File -Include *.dll,*.exe
          if ($outputs.Count -eq 0) {
            throw 'The build completed without producing a DLL or EXE.'
          }
          $outputs | Select-Object Name, Length | Format-Table

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhasmoCheatV-Release-x64
          if-no-files-found: error
          path: |
            build\*.dll
            build\*.exe
            build\*.pdb
